<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">

<title>melonn fleet — Fuera de servicio</title>
<style>
  :root { --lilac-deep: #5B3DF5; --bg: #0E0B2E; --card: #16123F; }

  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;

    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    color: #F4F2FF; padding: 24px;
  }
  .card {
    max-width: 440px; width: 100%; background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.12); border-radius: 16px; padding: 40px 32px;
    text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  .logo { font-size: 15px; font-weight: 800; letter-spacing: 0.04em; color: #B6ACFF; text-transform: uppercase; margin-bottom: 24px; }
  .icon { font-size: 40px; margin-bottom: 16px; }
  h1 { font-size: 21px; margin: 0 0 12px; color: #FFFFFF; }
  p { font-size: 14.5px; line-height: 1.6; color: #C9C3EE; margin: 0 0 8px; }
  .sub { font-size: 12.5px; color: #9088C4; margin-top: 20px; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">melonn fleet</div>
    <div class="icon">🛠️</div>
    <h1>Plataforma fuera de servicio</h1>
    <p>Melonn Fleet se encuentra fuera de servicio temporalmente por un ajuste técnico mayor.</p>
    <p>Se estará habilitando nuevamente en los próximos días.</p>

  </div>
</body>
